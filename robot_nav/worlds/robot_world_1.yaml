world:
  height: 10 # the height of the world
  width: 10 # the height of the world
  step_time: 0.3 # 10Hz calculate each step
  sample_time: 0.3 # 10 Hz for render and data extraction
  collision_mode: "reactive"

robot:
  - kinematics: { name: "diff" }
    shape: { name: "circle", radius: 0.2 }
    vel_min: [0, -1.0]
    vel_max: [1.0, 1.0]  # lower max linear speed to make world less stressful
    state: [2, 2, 0, 0]
    goal: [9, 9, 0]
    arrive_mode: position
    goal_threshold: 0.3

    sensors:
      - type: "lidar2d"
        range_min: 0
        range_max: 7
        angle_range: 3.14
        number: 180
        noise: True
        std: 0.08
        angle_std: 0.08
        offset: [0, 0, 0]
        alpha: 0.3

    plot:
      show_trajectory: True

# Reduced obstacle density and slower dynamics to create a less stressful environment
obstacle:
  - shape: {
        name: "linestring",
        vertices: [[0, 0], [10, 0], [10, 10], [0, 10], [0, 0]],
      } # vertices
    kinematics: { name: "static" }
    state: [0, 0, 0]

  - number: 1
    kinematics: { name: "omni" }
    distribution:
      { name: "random", range_low: [0, 0, -3.14], range_high: [10, 10, 3.14] }
    behavior:
      {
        name: "rvo",
        wander: True,
        range_low: [0, 0, -3.14],
        range_high: [10, 10, 3.14],
        vxmax: 0.12,
        vymax: 0.12,
        factor: 0.8,
      }
    vel_max: [0.12, 0.12]
    vel_min: [-0.12, -0.12]
    shape:
      - { name: "circle", radius: 0.6, random_shape: True }

  - shape: { name: "circle", radius: 0.8 }
    state: [5, 2, 1]
    kinematics: { name: "static" }
  - shape: { name: "rectangle", length: 1.0, width: 1.2 }
    state: [6, 5, 1]
    kinematics: { name: "static" }

